[project]
site_url = "https://geospatial.hcoco1.com"
site_name = "Ivan Arias — GIS & Geospatial Development"
docs_dir = "docs"

site_description = "This portfolio documents my development as a GIS professional through practical, evidence-based work — what I can do, how I did it, and how I verified it"
site_author = "Ivan Arias"

copyright = "Copyright &copy; 2026 Ivan Arias"

repo_url = "https://github.com/hcoco1/geospatial"
repo_name = "hcoco1/geospatial"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },

  { "Ivan" = [
    { "Professional profile" = "Home/Professional profile/index.md" },
    { "About" = "Home/About/index.md" },
    { "Competency overview" = "Home/Competency overview/index.md" }
  ] },

  { "Competencies" = [
    { "01 — Data sourcing & inspection" = "Competencies/01 — Data sourcing & inspection/index.md" },
    { "02 — Data cleaning" = "Competencies/02 — Data cleaning/index.md" }
  ] },

  { "Technical Evidence" = [
    { "01 — Data sourcing & inspection" = "Technical Evidence/01 — Data sourcing & inspection/index.md" },
    { "02 — Data cleaning" = "Technical Evidence/02 — Data cleaning/index.md" }
  ] },

]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]
[project.extra]
generator = false

[project.theme]
# variant = "classic"
#custom_dir = "overrides"
favicon = "images/favicon.png"

language = "en"

features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]


# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"



[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"


[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"


[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"


